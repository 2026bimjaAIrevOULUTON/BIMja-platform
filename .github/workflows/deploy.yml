name: Test and deploy
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Tools for gates (xmllint for BCF XSD validation)
        run: sudo apt-get install -y -qq libxml2-utils >/dev/null
      - name: Reference tools, CI only (IfcOpenShell + ifc4d are LGPL, never bundled)
        run: pip install --quiet ifcopenshell==0.9.0.post1 && pip install --quiet --no-deps ifc4d==0.9.0 ifc5d==0.9.0 && pip install --quiet openpyxl==3.1.5
      - run: npm test
      - name: Validate exported IFC with IfcOpenShell
        run: npm run validate-ifc
      - name: Reference gates (clash vs IfcOpenShell 0.8.5, CRS vs PROJ); CI only
        run: pip install --quiet --target /tmp/ios085 --no-deps ifcopenshell==0.8.5 && pip install --quiet pyproj==3.8.0 && IFCOS08=/tmp/ios085 npm run test:ref
      - run: npm run build
      - name: Load budget (fails over 600 KB gzipped first load)
        run: npm run budget
      - name: SBOM (CycloneDX)
        run: npm run sbom
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - name: Deploy to Cloudflare Pages (only if secrets are set)
        if: ${{ env.CF_TOKEN != '' }}
        run: npx wrangler@4 pages deploy dist --project-name bimja-platform --branch main
  pages:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
